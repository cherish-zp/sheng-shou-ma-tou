# Pier 构建与发布流水线（Tauri 2 + tauri-action）
#
# 触发：
#   - push tag `v*`  -> 构建四平台产物并直接创建 GitHub Release，
#                       随后把 Release 附件同步到 Gitee（需配置 GITEE_TOKEN secret，
#                       未配置时自动跳过，可运行 scripts/sync-gitee-release.sh 本地兜底）
#   - workflow_dispatch -> 仅构建并上传 workflow artifacts（手动验证用）
#
# 签名/公证：目前为占位。在仓库 Settings -> Secrets 配置好 APPLE_CERTIFICATE 等
# secret 后，下方 tauri-action 的 env 会自动生效，无需改动本文件。
# 完整流程见 docs/RELEASE.md。

name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ---------- 质量门禁：类型检查 + 前端构建 + Rust 测试 ----------
  check:
    name: Check (ubuntu)
    runs-on: ubuntu-22.04 # 若 runner 退役可改 ubuntu-24.04，系统依赖相同
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri v2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check & build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --workspace

  # ---------- 三平台构建 ----------
  build:
    name: Build ${{ matrix.slug }}
    needs: check
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # tauri-action 创建 Release 需要写权限
      issues: write # 构建失败时把日志开成 Issue（匿名可读，便于远程排障）
      actions: read # gh run view --log-failed 读取失败日志
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64（Apple Silicon）。macOS 链路对中文 productName 稳健，
          # .app/dmg 直接使用「圣手码头」（上传后由 patch-release-names job
          # 修复 tauri-action 剥字导致的附件名）。
          # 如需 universal2 合并包，可将两个 macos job 换成单个
          # --target universal-apple-darwin（见 docs/RELEASE.md）
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            slug: macos-arm64
          # macOS Intel
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            slug: macos-intel
          # Windows / Linux：rpm 规范化、NSIS 等工具链对非 ASCII 文件名
          # 不可靠（实测剥字/构建失败），构建时覆盖为 ASCII productName。
          - platform: windows-latest
            args: --config '{"productName":"ShengShouMaTou"}'
            slug: windows-x64
          - platform: ubuntu-22.04 # 若 runner 退役可改 ubuntu-24.04
            args: --config '{"productName":"ShengShouMaTou"}'
            slug: linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri v2 Linux system dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- macOS 签名 + 公证（购买 Apple Developer 账号后按 docs/RELEASE.md 加回）----
          # 注意：不要以空字符串形式保留这些 env——secret 不存在时
          # `${{ secrets.X }}` 仍会把变量设置为空串，Tauri bundler 检测到
          # APPLE_CERTIFICATE 存在（哪怕为空）就会尝试导入证书并直接失败
          # （实测：SecKeychainItemImport ... parameters not valid）。
          # 启用签名时取消注释以下行并配置对应 secrets：
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ---- Windows 代码签名与更新器（启用时取消注释，见 docs/RELEASE.md）----
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          # tag 触发时创建 Release 草稿；手动触发时留空 -> 仅上传 artifacts
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && '圣手码头 v__VERSION__' || '' }}
          releaseBody: '从下方 Assets 下载对应平台的安装包。更新内容见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。'
          # 直接发布（dataBasePro 同款链路）：tag 推送即出正式 Release
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # workflow_dispatch（无 tag）时的产物兜底上传，产物名带平台便于下载
      - name: Upload bundles (workflow_dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: pier-${{ matrix.slug }}
          if-no-files-found: error
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      # 失败诊断：把失败步骤的日志尾部开成公开 Issue（Actions 日志对
      # 未登录访客不可见，Issue 让远程协作者无需登录即可定位）
      - name: Open diagnostic issue on failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_JOB_ID: ${{ github.job }}
        run: |
          LOGS=$(gh run view "$GITHUB_RUN_ID" --job "$GITHUB_JOB_ID" --log-failed 2>/dev/null | tail -120 || echo "log fetch failed")
          {
            echo "平台: ${{ matrix.slug }}"
            echo "运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo '<details><summary>失败日志（最后 120 行）</summary>'
            echo ""
            echo '```'
            echo "$LOGS"
            echo '```'
            echo '</details>'
          } > body.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "[CI] ${{ matrix.slug }} 构建失败 @ ${{ github.ref_name }} (${{ github.run_id }})" \
            --body-file body.md || echo "::warning::diagnostic issue creation failed"

  # ---------- 修复 macOS 中文附件名 ----------
  # tauri-action 上传附件时剥除中文字符（圣手码头_0.1.1_aarch64.dmg →
  # _0.1.1_aarch64.dmg）。macOS 的 .app/dmg 本体在构建端名字正确，
  # 这里用 GitHub API 直接 PATCH 附件名恢复中文（无需重传）。
  patch-release-names:
    name: Patch CJK asset names
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Restore CJK prefix in asset names
        run: |
          python3 - << 'PYEOF'
          import json, os, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          display = "圣手码头"

          assets = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases/tags/{tag}",
               "--jq", "[.assets[] | {id: .id, name: .name}]"]))
          for a in assets:
              name = a["name"]
              if name[:1] in ("_", "-"):
                  new_name = display + name
                  print(f"patch: {name!r} -> {new_name!r}")
                  subprocess.run(
                      ["gh", "api", "-X", "PATCH",
                       f"repos/{repo}/releases/assets/{a['id']}",
                       "-f", f"name={new_name}"],
                      check=True)
              else:
                  print(f"ok: {name!r}")
          PYEOF

  # ---------- Gitee 同步（dataBasePro 模式）----------
  # GitHub Release 发布后，把附件同步到 Gitee Release。全程 best-effort：
  # 未配置 GITEE_TOKEN 时跳过；同步失败不阻塞 GitHub 发布（可用
  # scripts/sync-gitee-release.sh 本地兜底）。
  sync-gitee:
    name: Sync release to Gitee
    needs: [build, patch-release-names]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: princess-zp
      GITEE_REPO: sheng-shou-ma-tou
      TAG: ${{ github.ref_name }}
    steps:
      - name: Skip when GITEE_TOKEN is not configured
        if: env.GITEE_TOKEN == ''
        run: echo "::notice::GITEE_TOKEN 未配置，跳过 Gitee 同步（可用 scripts/sync-gitee-release.sh 本地兜底）"

      - name: Sync assets to Gitee release
        if: env.GITEE_TOKEN != ''
        continue-on-error: true
        env:
          # gh CLI 需要显式 token（Actions 不会自动注入环境变量）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"

          # 1) GitHub Release 正文（tauri-action 已生成）
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          echo "GitHub release body fetched (${#BODY} chars)"

          # 2) Gitee Release：存在则复用，不存在则创建（幂等）
          RELEASE_ID=$(curl -sf --connect-timeout 20 "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" | jq -r '.id // empty' || true)
          if [ -z "${RELEASE_ID}" ]; then
            echo "Creating Gitee release ${TAG}..."
            PAYLOAD=$(jq -n --arg tag "$TAG" --arg body "$BODY" \
              '{tag_name: $tag, name: ("Pier " + $tag), body: $body, prerelease: false, target_commitish: "main"}')
            RELEASE_ID=$(curl -sf --connect-timeout 20 -X POST "${API}/releases?access_token=${GITEE_TOKEN}" \
              -H 'Content-Type: application/json' -d "$PAYLOAD" | jq -r '.id') || true
            if [ -z "${RELEASE_ID}" ]; then
              echo "::error::failed to create Gitee release (check GITEE_TOKEN permissions: projects)"
              exit 1
            fi
          fi
          echo "Gitee release id: ${RELEASE_ID}"

          # 3) 下载 GitHub Release 全部附件
          rm -rf dist && mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist

          # 4) 幂等上传：同名附件跳过，其余重试 4 次、间隔 30s。
          # Gitee 附件名支持中文：上传前把 ShengShouMaTou 前缀换成显示名「圣手码头」
          EXISTING=$(curl -sf "https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" | jq -r '.[].browser_download_url' | xargs -r -n1 basename || true)
          for f in dist/*; do
            BASE=$(basename "$f")
            NAME="圣手码头${BASE#ShengShouMaTou}"
            if [ "$NAME" != "$BASE" ]; then mv "$f" "dist/$NAME"; f="dist/$NAME"; fi
            if echo "$EXISTING" | grep -qx "$NAME"; then
              echo "skip existing: $NAME"; continue
            fi
            for i in 1 2 3 4; do
              echo "upload $NAME (attempt $i)..."
              if curl -sf --connect-timeout 20 --max-time 1800 \
                   -X POST "${API}/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
                   -F "file=@${f}"; then
                echo "uploaded: $NAME"; break
              fi
              [ "$i" = 4 ] && echo "::error::failed to upload $NAME to Gitee"
              sleep 30
            done
          done
